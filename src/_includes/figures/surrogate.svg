<svg viewBox="0 0 680 240" role="img" aria-label="Bars comparing optimization time: twelve hours with the traffic simulation, about three hours with an XGBoost or random forest surrogate and under one hour with a BPR function; a curve of total cost error falling from 0.67 to 0.16 percent as training data grows; and a model trained on a seven by seven grid network transferring to a five by five one.">
<circle cx="28" cy="21.5" r="8" fill="var(--accent)"/><text x="28" y="25.2" text-anchor="middle" class="svg-stepn">1</text><text class="svg-title" x="42" y="26">Optimization time, 200 evaluations on 100 cores</text>
<text class="svg-label" x="20" y="61" text-anchor="start" style="font-size:11.5px">Traffic simulation (LTM) + GA</text>
<rect x="200" y="50" width="200" height="15" rx="2" fill="#EEF1F4"/><rect class="anim" x="200" y="50" width="200.0" height="15" rx="2" fill="var(--red)" style="transform-origin:left;animation:meter 5.00s ease-out infinite alternate"/><text class="svg-num" x="406.0" y="62" text-anchor="start" style="font-size:11px">12 h</text>

<text class="svg-label" x="20" y="97" text-anchor="start" style="font-size:11.5px">XGBoost surrogate + GA</text>
<rect x="200" y="86" width="200" height="15" rx="2" fill="#EEF1F4"/><rect class="anim" x="200" y="86" width="52.7" height="15" rx="2" fill="var(--accent)" style="transform-origin:left;animation:meter 2.05s ease-out infinite alternate"/><text class="svg-num" x="258.66666666666663" y="98" text-anchor="start" style="font-size:11px">3.16 h</text>

<text class="svg-label" x="20" y="133" text-anchor="start" style="font-size:11.5px">Random forest surrogate + GA</text>
<rect x="200" y="122" width="200" height="15" rx="2" fill="#EEF1F4"/><rect class="anim" x="200" y="122" width="58.3" height="15" rx="2" fill="#3B6FB6" style="transform-origin:left;animation:meter 2.17s ease-out infinite alternate"/><text class="svg-num" x="264.3333333333333" y="134" text-anchor="start" style="font-size:11px">3.5 h</text>

<text class="svg-label" x="20" y="169" text-anchor="start" style="font-size:11.5px">BPR function + GA</text>
<rect x="200" y="158" width="200" height="15" rx="2" fill="#EEF1F4"/><rect class="anim" x="200" y="158" width="11.7" height="15" rx="2" fill="#98A1AD" style="transform-origin:left;animation:meter 1.23s ease-out infinite alternate"/><text class="svg-num" x="217.66666666666666" y="170" text-anchor="start" style="font-size:11px">0.7 h</text>

<text class="svg-label" x="20" y="206" text-anchor="start" style="font-size:11px">a surrogate learns how maintenance changes travel times,</text>
<text class="svg-label" x="20" y="221" text-anchor="start" style="font-size:11px">so the optimizer no longer simulates traffic every time</text>
<path class="arrow" d="M440,120 L462,120"/>
<circle cx="476" cy="21.5" r="8" fill="var(--accent)"/><text x="476" y="25.2" text-anchor="middle" class="svg-stepn">2</text><text class="svg-title" x="490" y="26">Accuracy and transfer</text>
<rect x="470" y="38" width="192" height="112" rx="4" class="panel-bg"/>
<line x1="482" y1="136" x2="652" y2="136" class="stroke-soft"/><path class="anim" d="M486,64 L530,98 L590,122 L646,128" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="190" style="--len:190;animation:draw 3s ease-out infinite alternate"/><circle class="anim pop" cx="486" cy="64" r="3.2" fill="var(--accent)" style="opacity:0;animation:popIn 3s ease-out 0.5s infinite"/><circle class="anim pop" cx="530" cy="98" r="3.2" fill="var(--accent)" style="opacity:0;animation:popIn 3s ease-out 1.0s infinite"/><circle class="anim pop" cx="590" cy="122" r="3.2" fill="var(--accent)" style="opacity:0;animation:popIn 3s ease-out 1.5s infinite"/><circle class="anim pop" cx="646" cy="128" r="3.2" fill="var(--accent)" style="opacity:0;animation:popIn 3s ease-out 2.0s infinite"/><text class="svg-num" x="492" y="60" text-anchor="start" style="font-size:10.5px">0.67%</text>
<text class="svg-num" x="646" y="120" text-anchor="end" style="font-size:10.5px">0.16%</text>
<text class="svg-label" x="478" y="147" text-anchor="start" style="font-size:9.5px">total-cost error as training data grows to 3M</text>

